name: oms-prod

x-backend-env: &backend-env
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: local
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""
  OMS_JWT_SECRET: ${OMS_JWT_SECRET:-change-this-oms-jwt-secret-please-0123456789}
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USERNAME: oms
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oms123456}
  REDIS_HOST: redis
  REDIS_PORT: 6379

services:
  mysql:
    image: mysql:8.4
    container_name: oms-mysql
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_USER: oms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oms123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - oms-mysql-data:/var/lib/mysql
      - /opt/oms/deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uoms -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: oms-redis
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - oms-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: oms-nacos
    restart: unless-stopped
    mem_limit: 768m
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 30

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: oms-rocketmq-namesrv
    restart: unless-stopped
    mem_limit: 384m
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m"
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - oms-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: oms-rocketmq-broker
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    command: sh mqbroker -n rocketmq-namesrv:9876
    ports:
      - "10911:10911"
      - "10909:10909"

  minio:
    image: minio/minio:latest
    container_name: oms-minio
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - oms-minio-data:/data

  oms-gateway:
    image: eclipse-temurin:21-jre
    container_name: oms-gateway
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *backend-env
      SERVER_PORT: "8080"
      OMS_OPEN_API_DEMO_MALL_SECRET: ${OMS_OPEN_API_DEMO_MALL_SECRET:-demo-mall-secret-change-me}
      OMS_OPEN_API_DEMO_MALL_MERCHANT_ID: "1"
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "18080:8080"
    volumes:
      - /opt/oms/jars/oms-gateway.jar:/app/app.jar:ro
    depends_on:
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - buzud

  user-service:
    image: eclipse-temurin:21-jre
    container_name: oms-user-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *backend-env
      SERVER_PORT: "8081"
      OMS_SEED_DEMO_DATA: "true"
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - /opt/oms/jars/user-service.jar:/app/app.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - buzud

  order-service:
    image: eclipse-temurin:21-jre
    container_name: oms-order-service
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *backend-env
      SERVER_PORT: "8082"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      OMS_MALL_CALLBACK_URL: http://buzud-server:8080
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - /opt/oms/jars/order-service.jar:/app/app.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - buzud

  inventory-service:
    image: eclipse-temurin:21-jre
    container_name: oms-inventory-service
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *backend-env
      SERVER_PORT: "8083"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - /opt/oms/jars/inventory-service.jar:/app/app.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - buzud

  after-sales-service:
    image: eclipse-temurin:21-jre
    container_name: oms-after-sales-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *backend-env
      SERVER_PORT: "8084"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      OMS_MALL_CALLBACK_URL: http://buzud-server:8080
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - /opt/oms/jars/after-sales-service.jar:/app/app.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - buzud

  payment-center:
    image: eclipse-temurin:21-jre
    container_name: oms-payment-center
    restart: unless-stopped
    mem_limit: 512m
    environment:
      <<: *backend-env
      SERVER_PORT: "8085"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      OMS_PAYMENT_MOCK_ONLY: "true"
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - /opt/oms/jars/payment-center.jar:/app/app.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - buzud

  integration-service:
    image: eclipse-temurin:21-jre
    container_name: oms-integration-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *backend-env
      SERVER_PORT: "8086"
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - /opt/oms/jars/integration-service.jar:/app/app.jar:ro
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
      - buzud

  admin-web:
    image: nginx:alpine
    container_name: oms-admin-web
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "18100:80"
    volumes:
      - /opt/oms/dist/admin:/usr/share/nginx/html:ro
      - /opt/oms/nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oms-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  portal-web:
    image: nginx:alpine
    container_name: oms-portal-web
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "18101:80"
    volumes:
      - /opt/oms/dist/portal:/usr/share/nginx/html:ro
      - /opt/oms/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oms-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  mobile-web:
    image: nginx:alpine
    container_name: oms-mobile-web
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "18102:80"
    volumes:
      - /opt/oms/dist/mobile:/usr/share/nginx/html:ro
      - /opt/oms/nginx/mobile.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oms-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  oms-mysql-data:
  oms-redis-data:
  oms-namesrv-logs:
  oms-broker-logs:
  oms-broker-store:
  oms-minio-data:

networks:
  default:
    name: oms-prod
  buzud:
    name: buzud_default
    external: true

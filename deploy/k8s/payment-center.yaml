apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-center
  namespace: oms
  labels:
    app: payment-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-center
  template:
    metadata:
      labels:
        app: payment-center
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: payment-center
          image: registry.example.com/oms/payment-center:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          envFrom:
            - configMapRef:
                name: oms-config
            - secretRef:
                name: oms-secret
          env:
            - name: SERVER_PORT
              value: "8085"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-center
  namespace: oms
spec:
  selector:
    app: payment-center
  ports:
    - port: 8085
      targetPort: 8085
      name: http

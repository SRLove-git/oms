server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: payment-center
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:nacos:oms-common.yaml?group=DEFAULT_GROUP&refresh-enabled=true
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refresh-enabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/oms_payment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:oms}
    password: ${MYSQL_PASSWORD:oms123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: payment-center-producer

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.oms.payment.entity
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.oms: ${LOG_LEVEL:INFO}

oms:
  internal-service-secret: ${OMS_INTERNAL_SERVICE_SECRET:change-this-internal-secret}
  payment:
    mock-only: ${OMS_PAYMENT_MOCK_ONLY:true}
    card:
      provider: ${OMS_CARD_PROVIDER:stripe}
      secret-key: ${OMS_CARD_SECRET_KEY:}
      webhook-secret: ${OMS_CARD_WEBHOOK_SECRET:}
      api-base-url: ${OMS_CARD_API_BASE_URL:https://api.stripe.com}
      return-url-base: ${OMS_CARD_RETURN_URL_BASE:http://localhost:5175}
      success-path: ${OMS_CARD_SUCCESS_PATH:/pay/result?status=success}
      cancel-path: ${OMS_CARD_CANCEL_PATH:/pay/result?status=cancel}
    wechat:
      mock-only: ${OMS_PAYMENT_WECHAT_MOCK_ONLY:true}
      mch-id: ${OMS_PAYMENT_WECHAT_MCH_ID:}
      app-id: ${OMS_PAYMENT_WECHAT_APP_ID:}
      serial-no: ${OMS_PAYMENT_WECHAT_SERIAL_NO:}
      private-key: ${OMS_PAYMENT_WECHAT_PRIVATE_KEY:}
      api-v3-key: ${OMS_PAYMENT_WECHAT_API_V3_KEY:}
      platform-public-key: ${OMS_PAYMENT_WECHAT_PLATFORM_PUBLIC_KEY:}
      platform-serial-no: ${OMS_PAYMENT_WECHAT_PLATFORM_SERIAL_NO:}
      notify-url: ${OMS_PAYMENT_WECHAT_NOTIFY_URL:}
      gateway-url: ${OMS_PAYMENT_WECHAT_GATEWAY_URL:https://api.mch.weixin.qq.com}
    alipay:
      mock-only: ${OMS_PAYMENT_ALIPAY_MOCK_ONLY:true}
      app-id: ${OMS_PAYMENT_ALIPAY_APP_ID:}
      private-key: ${OMS_PAYMENT_ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${OMS_PAYMENT_ALIPAY_PUBLIC_KEY:}
      notify-url: ${OMS_PAYMENT_ALIPAY_NOTIFY_URL:}
      return-url: ${OMS_PAYMENT_ALIPAY_RETURN_URL:}
      gateway-url: ${OMS_PAYMENT_ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
    yeahpay:
      enabled: ${OMS_YEAHPAY_ENABLED:false}
      app-id: ${OMS_YEAHPAY_APP_ID:}
      api-key: ${OMS_YEAHPAY_API_KEY:}
      merchant-id: ${OMS_YEAHPAY_MERCHANT_ID:}
      api-base-url: ${OMS_YEAHPAY_API_BASE_URL:https://open-api.yeahpay.sg/acceptance/acceptance-open-api}
      signature-domain: ${OMS_YEAHPAY_SIGNATURE_DOMAIN:https://open-api.yeahpay.sg/acceptance}
      connect-timeout-ms: ${OMS_YEAHPAY_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${OMS_YEAHPAY_READ_TIMEOUT_MS:20000}

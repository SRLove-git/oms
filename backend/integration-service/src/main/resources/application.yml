server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: integration-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: smtpdm.aliyun.com
    port: 465
    username: no-reply@mail.medical-sg.com
    password: V86gbdqa8RyJQb
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  config:
    import:
      - optional:nacos:oms-common.yaml?group=DEFAULT_GROUP&refresh-enabled=true
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refresh-enabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/oms_integration?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:oms}
    password: ${MYSQL_PASSWORD:oms123456}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: integration-service-producer

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.oms.integration.entity
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.oms: ${LOG_LEVEL:INFO}

oms:
  integration:
    notification:
      provider: ${OMS_INTEGRATION_NOTIFICATION_PROVIDER:smtp}
      reply-to: ${OMS_INTEGRATION_NOTIFICATION_REPLY_TO:support@medical-sg.com}
      mock-only: ${OMS_INTEGRATION_NOTIFICATION_MOCK_ONLY:true}
      base-url: ${OMS_INTEGRATION_NOTIFICATION_BASE_URL:}
      api-key: ${OMS_INTEGRATION_NOTIFICATION_API_KEY:}
    logistics:
      mock-only: ${OMS_INTEGRATION_LOGISTICS_MOCK_ONLY:true}
      base-url: ${OMS_INTEGRATION_LOGISTICS_BASE_URL:}
      api-key: ${OMS_INTEGRATION_LOGISTICS_API_KEY:}
    platform:
      mock-only: ${OMS_INTEGRATION_PLATFORM_MOCK_ONLY:true}
      base-url: ${OMS_INTEGRATION_PLATFORM_BASE_URL:}
      api-key: ${OMS_INTEGRATION_PLATFORM_API_KEY:}

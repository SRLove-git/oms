server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:nacos:oms-common.yaml?group=DEFAULT_GROUP&refresh-enabled=true
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refresh-enabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/oms_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:oms}
    password: ${MYSQL_PASSWORD:oms123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: order-service-producer

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.oms.order.entity
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.oms: ${LOG_LEVEL:INFO}

oms:
  order:
    timeout-minutes: ${OMS_ORDER_TIMEOUT_MINUTES:30}
    timeout-scan-ms: ${OMS_ORDER_TIMEOUT_SCAN_MS:60000}
    archive-days: ${OMS_ORDER_ARCHIVE_DAYS:180}
    archive-scan-ms: ${OMS_ORDER_ARCHIVE_SCAN_MS:3600000}
    archive-batch-size: ${OMS_ORDER_ARCHIVE_BATCH_SIZE:200}
  report:
    cache-ttl-seconds: ${OMS_REPORT_CACHE_TTL_SECONDS:300}
    daily-cron: ${OMS_REPORT_DAILY_CRON:0 10 1 * * ?}
